server:
  port: 8080

spring:
  application:
    name: ms-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true

          routes:
            - id: clientes
              uri: http://localhost:8082
              predicates:
                - Path=/api/clientes/**

            - id: facturaciones
              uri: http://localhost:8083
              predicates:
                - Path=/api/facturacion/**

            - id: inventarios
              uri: http://localhost:8084
              predicates:
                - Path=/api/inventario/**

            - id: pagos
              uri: http://localhost:8085
              predicates:
                - Path=/api/pago/**

            - id: seguridad
              uri: http://localhost:8086
              predicates:
                - Path=/api/seguridad/**

            - id: sales
              uri: http://localhost:8087
              predicates:
                - Path=/api/venta/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8089/realms/keycloack-libreria